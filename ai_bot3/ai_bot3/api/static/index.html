    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(113,112,255,.14),transparent 34%),var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-feature-settings:'cv01','ss03';}body{padding:18px}.page{max-width:1820px;margin:0 auto}.shell{border:1px solid var(--line);background:rgba(15,16,17,.82);border-radius:22px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 20px 80px rgba(0,0,0,.38);overflow:hidden}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015))}.title h1{margin:0;font-size:24px;line-height:1.05;letter-spacing:-.55px;font-weight:510}.title p{margin:8px 0 0;color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.ctrl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}select,input,button{font-family:inherit}select,input{height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);padding:0 10px;outline:none}select option,select optgroup{background:#0f1011;color:#f7f8f8}@-moz-document url-prefix(){select option{background:#0f1011;color:#f7f8f8}}button{height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--sub);padding:0 12px;font-weight:510;cursor:pointer}button.primary{background:var(--brand);border-color:rgba(130,143,255,.35);color:#fff}button:hover{background:rgba(255,255,255,.07)}button.primary:hover{background:#7170ff}.model-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:999px;padding:7px 10px;color:var(--sub);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.content{padding:14px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chart-card,.panel{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:16px;overflow:hidden}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.025)}.card-title{font-size:13px;font-weight:590;color:var(--text)}.card-sub{font-size:11px;color:var(--muted)}.chart{height:392px}.panel{margin-top:14px;padding:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.panel h2{margin:0;font-size:18px;letter-spacing:-.28px;font-weight:590}.hint{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:10px}.prediction-hero{display:grid;grid-template-columns:1.1fr repeat(3,.7fr);gap:10px;margin-bottom:12px}.stat,.mode-card,.ai-card,.ai-overview{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.028);padding:12px}.stat.feature{background:linear-gradient(135deg,rgba(94,106,210,.22),rgba(255,255,255,.025));border-color:rgba(113,112,255,.35)}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:6px}.big{font-size:22px;font-weight:590;letter-spacing:-.35px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:590;border:1px solid var(--line)}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--yellow)}.badge.up{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.1)}.badge.down{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.1)}.badge.flat{border-color:rgba(255,209,102,.3);background:rgba(255,209,102,.08)}.mode-card h3,.ai-card h3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 9px;font-size:14px;font-weight:590}.mode-line{font-size:13px;color:var(--sub);line-height:1.55;margin-bottom:10px}.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:12px;border-top:1px solid var(--line2);padding-top:9px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){color:var(--sub);text-align:right}.mode-section{margin-top:10px}.mode-section + .mode-section{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2)}.mode-section-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:4px}.mode-section-label strong{color:var(--text);font-weight:590;letter-spacing:.2px}.mode-section.btc .mode-section-label strong{color:var(--yellow)}.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}.sources{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.pill{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:rgba(255,255,255,.025)}.ai-overview{white-space:pre-wrap;line-height:1.65;color:var(--sub);font-size:13px;margin-bottom:10px}.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.ai-body{white-space:pre-wrap;line-height:1.62;color:var(--sub);font-size:13px}.ai-meta{font-size:11px;color:var(--muted);margin-top:8px}.status-local{color:var(--yellow);border-color:rgba(255,209,102,.35);background:rgba(255,209,102,.08)}.status-ai{color:var(--green);border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}.error{color:#fca5a5}.loading{color:var(--muted);padding:12px}.ai-note{font-size:12px;color:var(--muted);margin-top:8px}.btc-compare{margin-top:10px;border:1px solid var(--line2);background:rgba(0,0,0,.18);border-radius:10px;padding:8px;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:1100px){.top{display:block}.controls{justify-content:flex-start;margin-top:14px}.charts,.prediction-hero{grid-template-columns:1fr}.chart{height:340px}}

<body>
<div class="page"><div class="shell">
  <header class="top">
    <div class="title"><h1>爆仓图实时狙击系统</h1><p>Linear 风格 · 四图爆仓热力 / 本地预测 / BTC 锚点 / AI 总览</p></div>
    <div class="controls">

      <div class="chart-card"><div class="card-head"><span class="card-title">BTCUSDT · 锚点价值轴</span><span class="card-sub">全市场方向锚</span></div><div id="leftChart2" class="chart"></div></div>
      <div class="chart-card"><div class="card-head"><span class="card-title">BTCUSDT · 锚点全区间</span><span class="card-sub">对比当前币种</span></div><div id="rightChart2" class="chart"></div></div>
    </section>
    <section class="panel"><div class="panel-head"><h2>数据预测结果</h2><span class="hint">完整展示 5 个模式，含 BTC 同周期对比与当前点位模型</span></div><div id="predictionResult"><div class="loading">等待加载...</div></div></section>
    <section class="panel"><div class="panel-head"><h2>AI 预测结果</h2><span class="hint" id="aiAutoStatus">自动刷新中：AI总览 1分钟 / AI摘要 3分钟</span><button onclick="fetchPrediction2(currentSymbol)">立即重试失败项</button></div><div id="predictionResult2"><div class="loading">等待加载...</div></div></section>
  </main>
</div></div>
<script>
const MODES=['scalping','mid_short','trend','trend_swing','swing'];
const MODE_LABEL={scalping:'超短线',mid_short:'中短线',trend:'趋势',trend_swing:'趋势波段',swing:'波段'};
let currentSymbol='XRP', currentModel='auto', currentPointModel='-';
const PREDICTION_POLL_MS=60000, AI_CACHE_POLL_MS=30000, AI_RETRY_POLL_MS=180000, AI_THROTTLE_MS=60000;
let lastPredictionPayload='', lastAiPayload='', lastAiFetchAt=0, lastAiRetryAt=0;
const leftChart1=echarts.init(document.getElementById('leftChart1'));
const rightChart1=echarts.init(document.getElementById('rightChart1'));
const leftChart2=echarts.init(document.getElementById('leftChart2'));
const rightChart2=echarts.init(document.getElementById('rightChart2'));
const charts=[leftChart1,rightChart1,leftChart2,rightChart2];
document.getElementById('symbolSelector').addEventListener('change',e=>{currentSymbol=e.target.value;refreshAll()});
['thresholdInput','prioritySelector','strategySelector'].forEach(id=>document.getElementById(id).addEventListener('change',refreshAll));
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null} function fmt(v,d=4){const n=num(v);return n===null?'-':n.toFixed(d)} function pct(v){const n=num(v);return n===null?'-':(n*100).toFixed(3)+'%'} function timeTxt(v){if(!v)return '-';const raw=String(v);const iso=/Z$|[+-]\d\d:?\d\d$/.test(raw)?raw:raw.replace(' ','T');const d=new Date(iso);if(!Number.isNaN(d.getTime()))return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});return raw.slice(5,19).replace('T',' ')}
function priceRetOf(x){if(num(x?.display_price_return)!==null)return num(x.display_price_return);if(num(x?.display_predicted_return)!==null)return num(x.display_predicted_return);const p=num(x?.pred),l=num(x?.last);if(p!==null&&l)return (p-l)/l;if(num(x?.price_predicted_return)!==null)return num(x.price_predicted_return);if(num(x?.predicted_return)!==null)return num(x.predicted_return);if(num(x?.raw_predicted_return)!==null)return num(x.raw_predicted_return);return null}
function tradeRetOf(x){if(num(x?.display_trade_return)!==null)return num(x.display_trade_return);if(num(x?.trade_predicted_return)!==null)return num(x.trade_predicted_return);const r=priceRetOf(x);if(r===null)return null;const d=String(x?.display_direction||x?.trade_direction||x?.display_trade_signal||x?.trade_trend_display||x?.price_trend||'').toLowerCase();if(d.includes('short')||d.includes('down'))return -r;if(d.includes('long')||d.includes('up'))return r;return 0}
function priceTrendMeta(x){const TH=0.0005;let s=String(x?.display_price_trend||x?.price_trend||'').toLowerCase();const p=num(x?.pred),l=num(x?.last);if(p!==null&&l!==null&&l!==0){const r=(p-l)/l;if(r>TH)s='up';else if(r<-TH)s='down';else if(!s)s='flat'}if(s.includes('up')||s.includes('long'))return{cls:'up',txt:'上涨 / 看多',short:'偏多'};if(s.includes('down')||s.includes('short'))return{cls:'down',txt:'下跌 / 看空',short:'偏空'};return{cls:'flat',txt:'震荡 / 中性',short:'中性震荡'}}
function tradeSignalHtml(x){const TH=0.0005;let d=String(x?.display_trade_signal||x?.display_direction||x?.display_price_trend||x?.price_trend||'').toLowerCase();const p=num(x?.pred),l=num(x?.last);if(p!==null&&l!==null&&l!==0){const r=(p-l)/l;if(r>TH)d='up';else if(r<-TH)d='down';else d='flat'}let cls='flat',txt='观望';if(d.includes('up')||d.includes('long')){cls='up';txt='做多'}else if(d.includes('down')||d.includes('short')){cls='down';txt='做空'}return `<span class="badge ${cls}">${txt}</span>`}
function ciText(ci){return Array.isArray(ci)&&ci.length>=2?`[${fmt(ci[0])}, ${fmt(ci[1])}]`:'暂无'}
function trendMeta(v,pred,last){let s=String(v||'').toLowerCase();if(!s||s==='flat'){const p=num(pred),l=num(last);if(p!==null&&l!==null&&Math.abs(p-l)/Math.max(l,1)>0.001)s=p>l?'up':'down'}if(s.includes('up')||s.includes('long'))return{cls:'up',txt:'上涨 / 看多',short:'偏多'};if(s.includes('down')||s.includes('short'))return{cls:'down',txt:'下跌 / 看空',short:'偏空'};return{cls:'flat',txt:'震荡 / 中性',short:'中性震荡'}}
function trendBadge(x){const t=priceTrendMeta(x);return `<span class="badge ${t.cls}">${t.txt}</span>`}
function fullSymbol(s){return String(s||'').endsWith('USDT')?s:s+'USDT'}
function updateTitles(){document.getElementById('chartTitle1').textContent=fullSymbol(currentSymbol)+' · 价值轴爆仓图';document.getElementById('chartTitle2').textContent=fullSymbol(currentSymbol)+' · 全区间点位图'}
async function api(path){const r=await fetch(`${API_BASE}${path}`);if(!r.ok)throw new Error(path+' '+r.status);return r.json()}
function renderPair(chart,rightChart,data,pointsData){
  currentPointModel=pointsData.model||pointsData.model_key||'未知模型';document.getElementById('modelNameDisplay').textContent='当前模型: '+currentPointModel;
  const xData=Object.keys(data.liqMapV2||{}).map(k=>parseFloat(k)).filter(Number.isFinite).sort((a,b)=>a-b), currentPrice=Number(data.lastPrice);let pointPrices=[];(pointsData.points&&pointsData.points.long||[]).forEach(p=>pointPrices.push(p.price));(pointsData.points&&pointsData.points.short||[]).forEach(p=>pointPrices.push(p.price));
  const categoryData=Array.from(new Set([...xData,currentPrice,...pointPrices])).sort((a,b)=>a-b);const maps=[{}, {}, {}, {}];
  categoryData.forEach(price=>{let vals=[0,0,0,0];(data.liqMapV2[String(price)]||[]).forEach(e=>{if(e[2]===10)vals[0]+=e[1];if(e[2]===25)vals[1]+=e[1];if(e[2]===50)vals[2]+=e[1];if(e[2]===100)vals[3]+=e[1]});vals.forEach((v,i)=>maps[i][price]=v)});
  const series=maps.map(m=>categoryData.map(p=>[p,m[p]||0]));let cumulativeLong=new Array(categoryData.length).fill(null),cumulativeShort=new Array(categoryData.length).fill(null),totalLong=0,totalShort=0;let currentIndex=categoryData.findIndex(p=>p>=currentPrice);if(currentIndex<0)currentIndex=0;
  for(let i=currentIndex;i>=0;i--){totalLong+=series.reduce((s,a)=>s+(a[i]?.[1]||0),0);cumulativeLong[i]=[categoryData[i],totalLong]}for(let i=currentIndex;i<categoryData.length;i++){totalShort+=series.reduce((s,a)=>s+(a[i]?.[1]||0),0);cumulativeShort[i]=[categoryData[i],totalShort]}
  const markLines=[];(pointsData.points&&pointsData.points.long||[]).forEach(p=>markLines.push({name:p.label,xAxis:p.price,label:{formatter:p.label,color:'#10b981'},lineStyle:{type:'dashed',color:'#10b981',width:1.5}}));(pointsData.points&&pointsData.points.short||[]).forEach(p=>markLines.push({name:p.label,xAxis:p.price,label:{formatter:p.label,color:'#ef4444'},lineStyle:{type:'dashed',color:'#ef4444',width:1.5}}));
  const option={backgroundColor:'#0f1011',color:['#7170ff','#60a5fa','#a78bfa','#f59e0b','#10b981','#ef4444'],tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#191a1b',borderColor:'rgba(255,255,255,.1)',textStyle:{color:'#f7f8f8'}},legend:{data:['10x 杠杆','25x 杠杆','50x 杠杆','100x 杠杆','累计多头爆仓','累计空头爆仓'],textStyle:{color:'#d0d6e0',fontSize:11},top:8},grid:{left:58,right:58,top:54,bottom:52},dataZoom:[{type:'inside',start:80,end:100},{type:'slider',start:80,end:100,bottom:14,height:18,textStyle:{color:'#8a8f98'}}],xAxis:{type:'value',name:'价格',nameTextStyle:{color:'#8a8f98'},axisLabel:{color:'#8a8f98',formatter:v=>Number(v).toFixed(4)},axisLine:{lineStyle:{color:'rgba(255,255,255,.12)'}},splitLine:{lineStyle:{color:'rgba(255,255,255,.05)'}}},yAxis:[{type:'value',name:'清算金额',nameTextStyle:{color:'#8a8f98'},axisLabel:{color:'#8a8f98'},splitLine:{lineStyle:{color:'rgba(255,255,255,.05)'}}},{type:'value',name:'累计爆仓',nameTextStyle:{color:'#8a8f98'},axisLabel:{color:'#8a8f98'},splitLine:{show:false}}],series:[{name:'10x 杠杆',type:'bar',data:series[0],barWidth:'55%'},{name:'25x 杠杆',type:'bar',data:series[1],barWidth:'55%'},{name:'50x 杠杆',type:'bar',data:series[2],barWidth:'55%'},{name:'100x 杠杆',type:'bar',data:series[3],barWidth:'55%'},{name:'累计多头爆仓',type:'line',smooth:true,showSymbol:false,yAxisIndex:1,data:cumulativeLong,lineStyle:{color:'#10b981',width:2}},{name:'累计空头爆仓',type:'line',smooth:true,showSymbol:false,yAxisIndex:1,data:cumulativeShort,lineStyle:{color:'#ef4444',width:2}},{name:'当前价格',type:'line',data:[],markLine:{symbol:['none','arrow'],silent:true,precision:8,data:[{xAxis:currentPrice}],lineStyle:{color:'#ffd166',width:2,type:'dashed'},label:{formatter:'当前价格: '+currentPrice,position:'end',color:'#ffd166'}}},{name:'狙击点位',type:'line',silent:true,markLine:{symbol:['none','none'],label:{position:'insideEndTop'},silent:true,data:markLines},data:[]}]} ;
  chart.setOption(option,true);const rightOption=JSON.parse(JSON.stringify(option));rightOption.xAxis.type='category';rightOption.xAxis.data=categoryData.map(x=>String(x));rightOption.dataZoom=[{type:'inside',start:0,end:100},{type:'slider',start:0,end:100,bottom:14,height:18,textStyle:{color:'#8a8f98'}}];rightOption.series.forEach(s=>{if(s.type==='bar'||s.name==='累计多头爆仓'||s.name==='累计空头爆仓')s.data=s.data.map(item=>item?item[1]:0);else if(s.markLine)s.markLine.data=s.markLine.data.map(item=>({xAxis:String(item.xAxis),label:item.label,lineStyle:item.lineStyle,name:item.name}))});rightChart.setOption(rightOption,true)
}
async function fetchAndRender(chart,symbol,rightChart){const strategy=document.getElementById('strategySelector').value,priority=document.getElementById('prioritySelector').value,threshold=parseFloat(document.getElementById('thresholdInput').value);const [d,p]=await Promise.all([api(`/liqmap/${symbol}`),api(`/liqmap/points/${symbol}?model=${currentModel}&threshold=${threshold}&priority=${priority}&strategy=${strategy}`)]);renderPair(chart,rightChart,d,p)}
function metricHint(label,text){return `<span>${label}<small class="metric-tip">${text}</small></span>`}
function metricsKv(x){const t=priceTrendMeta(x),pr=priceRetOf(x),tr=tradeRetOf(x),lev=num(x?.target_leverage??x?.brain_prediction?.leverage),levRet=num(x?.display_trade_leveraged_return??x?.trade_leveraged_return),met=x?.trade_target_met===true;const rmse=num(x?.rmse),rawScore=num(x?.score),ens=num(x?.ensemble_score),conf=num(x?.direction_confidence??x?.confidence??x?.brain_prediction?.confidence);const ensCls=(ens??0)>0?'up':((ens??0)<0?'down':'flat');return `<div class="kv"><span>当前价</span><span class="mono">${fmt(x?.last)}</span><span>预测价</span><span class="mono ${t.cls}">${fmt(x?.pred)}</span><span>价格涨跌</span><span class="mono ${(pr||0)>=0?'up':'down'}">${pct(pr)}</span><span>交易收益</span><span class="mono ${(tr||0)>=0?'up':'down'}">${pct(tr)}</span><span>杠杆后收益</span><span class="mono ${(levRet||0)>=0?'up':'down'}">${lev?fmt(lev,0)+'x · ':''}${pct(levRet)}</span><span>31%目标</span><span>${met?'<span class="badge up">达标</span>':'<span class="badge flat">未达标</span>'}</span><span>置信区间</span><span class="mono">${esc(ciText(x?.ci))}</span><span>预测趋势</span><span>${trendBadge(x)}</span><span>交易信号</span><span>${tradeSignalHtml(x)}</span>${metricHint('RMSE','误差，越小越好')}</span><span class="mono">${fmt(rmse,8)}</span>${metricHint('基础score','|预测价-当前价|/(1.96×RMSE)，越大代表偏离误差区间越明显')}</span><span class="mono">${fmt(rawScore,4)}</span>${metricHint('模型分数','ensemble_score 融合分：正=偏多，负=偏空，绝对值越大信号越强')}</span><span class="mono ${ensCls}">${fmt(ens,4)}</span>${metricHint('置信度','通常取 |模型分数| 或在线校准/Brain置信度，越大方向越强')}</span><span class="mono">${fmt(conf,4)}</span><span>生成时间</span><span>${esc(timeTxt(x?.generated_at))}</span></div>`}
function modeCard(mode,result,btc){const bundle=result.modes?.[mode]||{},x=bundle.local_prediction||{};const btcBundle=btc.modes?.[mode]||{},btcX=btcBundle.local_prediction||{};const symLabel=esc(result.symbol||fullSymbol(currentSymbol));if(x.message)return `<div class="mode-card"><h3>${MODE_LABEL[mode]} <span class="badge flat">${esc(mode)}</span></h3><div class="mode-line">${esc(x.message)}</div><div class="mode-section btc"><div class="mode-section-label"><strong>BTCUSDT</strong><span>BTC 锚点 · 同模式</span></div>${btcX.message?`<div class="mode-line">${esc(btcX.message)}</div>`:metricsKv(btcX)}</div></div>`;const t=priceTrendMeta(x),pr=priceRetOf(x),tr=tradeRetOf(x),lev=num(x?.target_leverage??x?.brain_prediction?.leverage),levRet=num(x?.display_trade_leveraged_return??x?.trade_leveraged_return),met=x?.trade_target_met===true;return `<div class="mode-card"><h3>${MODE_LABEL[mode]} <span class="badge ${t.cls}">${esc(mode)}</span></h3><div class="mode-line">${MODE_LABEL[mode]}：${esc(x.timeframe||'-')} 周期${t.short}，预测 <span class="mono ${t.cls}">${fmt(x.pred)}</span>，价格涨跌 <span class="mono ${(pr||0)>=0?'up':'down'}">${pct(pr)}</span>，交易收益 <span class="mono ${(tr||0)>=0?'up':'down'}">${pct(tr)}</span>，杠杆后 <span class="mono ${(levRet||0)>=0?'up':'down'}">${lev?fmt(lev,0)+'x · ':''}${pct(levRet)}</span>，31%目标 ${met?'已达标':'未达标'}，当前点位模型 ${esc(currentPointModel)}。</div><div class="mode-section"><div class="mode-section-label"><strong>${symLabel}</strong><span>当前币种 · 同模式</span></div>${metricsKv(x)}</div><div class="mode-section btc"><div class="mode-section-label"><strong>BTCUSDT</strong><span>BTC 锚点 · 同模式</span></div>${btcX.message?`<div class="mode-line">${esc(btcX.message)}</div>`:metricsKv(btcX)}</div></div>`}
function modeRank(x){
  // 达标口径：根据 pred/last 的涨跌幅收益 × 当前币种倍率 >= 31%。收益率只用于“是否达标”，不参与达标后的优先排序。
  // 主排序：RMSE 越小越好；副排序：模型分数看方向强弱，排序用正向分；再看置信度和数据新鲜度。
  const brain=x.brain_prediction||{};
  const lev=Math.abs(num(x.target_leverage??brain.leverage)??1)||1;
  const targetLev=Math.abs(num(x.target_leveraged_profit??brain.target_leveraged_profit)??0.31)||0.31;
  const tradeRet=num(x.display_trade_return??x.trade_predicted_return);
  const leveragedTradeRet=num(x.display_trade_leveraged_return??x.trade_leveraged_return);
  const effectiveLeveragedRet=leveragedTradeRet!==null?leveragedTradeRet:((tradeRet??0)*lev);
  const targetOk=(x.trade_target_met===true)||effectiveLeveragedRet>=targetLev;
  const rmse=num(x.rmse);
  const last=Math.abs(num(x.last)??0);
  const rmsePct=(rmse!==null&&last>0)?rmse/last:999;
  const rmseRank=-rmsePct; // 达标后主排序：越小越好
  const modelScore=Math.max(-1,Math.min(1,num(x.ensemble_score)??0));
  const conf=num(brain.confidence)??num(x.direction_confidence??x.confidence)??0;
  const freshnessPenalty=(x.current_price_warning||x.data_source_status&&x.data_source_status!=='ok')?0.5:0;
  // lexicographic-like: target gate > RMSE > model score > confidence. No return magnitude.
  const rank=(targetOk?1e9:0)+rmseRank*1e6+Math.max(0,modelScore)*1000+conf*10-freshnessPenalty;
  return {rank,targetOk,rmsePct,modelScore,conf};
}
function bestLocal(pred){
  let best=null;
  MODES.forEach(m=>{
    const x=pred.modes?.[m]?.local_prediction||{}; if(x.message)return;
    const r=modeRank(x);
    if(!best||r.rank>best.rank)best={mode:m,x,...r};
  });
  return best;
}
function renderPredictionPanel(result,btc,symbol){const b=bestLocal(result),bb=bestLocal(btc);let html='<div class="prediction-hero">';html+=`<div class="stat feature"><div class="eyebrow">${esc(result.symbol||fullSymbol(symbol))} · 当前点位模型</div><div class="big">${esc(currentPointModel)}</div><div class="hint">点位模型用于爆仓图狙击线；走势判断来自本地预测 + BTC 锚点。</div></div>`;html+=`<div class="stat"><div class="eyebrow">当前币种最强模式</div><div class="big">${esc(b?.mode||'-')}</div><div>${b?trendBadge(b.x):'-'}</div><div class="hint">达标=根据涨跌算出的收益×该币倍率≥31%；达标后按 RMSE 优先、模型分数为副。</div></div>`;html+=`<div class="stat"><div class="eyebrow">BTC 锚点</div><div class="big">${esc(bb?.mode||'-')}</div><div>${bb?trendBadge(bb.x):'-'}</div></div>`;html+=`<div class="stat"><div class="eyebrow">方向关系</div><div class="big">${b&&bb?(priceTrendMeta(b.x).short===priceTrendMeta(bb.x).short?'同向':'背离'):'-'}</div><div class="hint">背离时降低仓位，等待 BTC 确认。</div></div></div>`;html+=`<div class="grid">${MODES.map(m=>modeCard(m,result,btc)).join('')}</div>`;return html}
async function fetchPrediction(symbol,opts={}){const box=document.getElementById('predictionResult');if(!opts.silent)box.innerHTML='<div class="loading">正在加载数据预测结果...</div>';try{const [result,btc]=await Promise.all([api(`/predict/${symbol}`),api('/predict/BTC')]);const payload=JSON.stringify({result,btc});if(opts.silent&&payload===lastPredictionPayload)return;lastPredictionPayload=payload;box.innerHTML=renderPredictionPanel(result,btc,symbol)}catch(e){if(!opts.silent)box.innerHTML=`<div class="error">获取预测结果失败: ${esc(e.message||e)}</div>`}}
function auxUsable(aux){return aux&&aux.summary&&aux.status==='ok'&&!aux.summary.includes('未启用或调用失败')&&!aux.summary.includes('未启用，请')}
function aiFallbackText(mode,payload,aux){const local=payload.local_prediction||{};const t=priceTrendMeta(local),r=tradeRetOf(local);let reason=aux?.error||aux?.summary||'等待后端生成 OpenAI 分模式摘要';return `${MODE_LABEL[mode]}（${mode}）AI摘要暂不可用：${reason}。本地参考：当前${t.short}，点位模型 ${currentPointModel}，预测价 ${fmt(local.pred)}，现价 ${fmt(local.last)}，交易收益 ${pct(r)}，置信区间 ${ciText(local.ci)}。`}
function evalMetricsHtml(payload){const ev=(payload&&payload.evaluation)||{};if(!ev||(typeof ev!=='object'))return '';const parts=[];const hr=(ev.hit_rate!=null)?ev.hit_rate:(ev.accuracy!=null?ev.accuracy:null);if(hr!=null){let v=Number(hr);if(!Number.isNaN(v)){if(Math.abs(v)<=1.000001)v=v*100;parts.push(`命中率 ${v.toFixed(1)}%`)}}if(ev.settled!=null)parts.push(`已结算 ${esc(ev.settled)}`);else if(ev.settled_count!=null)parts.push(`已结算 ${esc(ev.settled_count)}`);if(ev.pending!=null)parts.push(`待结算 ${esc(ev.pending)}`);else if(ev.pending_count!=null)parts.push(`待结算 ${esc(ev.pending_count)}`);const lp=(ev.long_precision!=null)?ev.long_precision:(ev.precision_long!=null?ev.precision_long:null);const sp=(ev.short_precision!=null)?ev.short_precision:(ev.precision_short!=null?ev.precision_short:null);function _pp(x){let v=Number(x);if(Number.isNaN(v))return null;if(Math.abs(v)<=1.000001)v=v*100;return v.toFixed(1)+'%'}if(lp!=null||sp!=null){const a=lp!=null?_pp(lp):'-';const b=sp!=null?_pp(sp):'-';parts.push(`多/空precision ${a}/${b}`)}const ar=(ev.avg_actual_return!=null)?ev.avg_actual_return:(ev.average_actual_return!=null?ev.average_actual_return:(ev.avg_return!=null?ev.avg_return:null));if(ar!=null){let v=Number(ar);if(!Number.isNaN(v)){if(Math.abs(v)<=1.000001)v=v*100;parts.push(`平均实际收益 ${v.toFixed(2)}%`)}}return parts.length?`<div class="ai-meta">${parts.map(esc).join(' · ')}</div>`:''}
function aiCardHtml(mode,payload,aux){const ok=auxUsable(aux);const body=esc(ok?aux.summary:aiFallbackText(mode,payload||{},aux||{}));const metrics=evalMetricsHtml(payload||{});return `<div class="ai-card" id="ai-card-${mode}"><h3>${MODE_LABEL[mode]} AI摘要 <span class="badge ${ok?'status-ai':'status-local'}">${ok?'OpenAI':esc(aux?.status||'等待AI')}</span></h3><div class="ai-body">${body}</div>${metrics}<div class="ai-meta">AI生成时间：${esc(timeTxt(aux?.generated_at))}</div></div>`}
function renderAiGrid(pred,over=''){let html=over||'';html+='<div class="ai-grid">';MODES.forEach(m=>{const payload=pred?.modes?.[m]||{},aux=payload.openai_prediction||{};html+=aiCardHtml(m,payload,aux)});html+='</div>';return html}
function overviewHeaderHtml(over,modelName){
  const status=over?.status||'unknown';
  const summary=over?.summary||'';
  const generated=over?.updated_at||over?.generated_at||'';
  const cls=(status==='ok')?'status-ai':(status==='fallback'?'status-local':'status-local');
  const label=(status==='ok')?'AI总览（缓存）':(status==='fallback'?'AI总览（本地降级）':(status==='cache_missing'?'AI总览（待生成）':`AI总览（${esc(status)}）`));
  const head=`<span class="badge ${cls}">${label}</span> · 模型：${esc(modelName||over?.model||'-')} · 点位模型：${esc(currentPointModel)} · 生成时间：${esc(timeTxt(generated))}`;
  return `<div class="ai-overview">${head}\n${esc(summary)}</div><div class="ai-note">AI总览每分钟由后端生成；AI分模式摘要每 3 分钟刷新。前端只展示缓存，不再触发浏览器侧 EventSource。AI总览生成时间：${esc(timeTxt(generated))}</div>`;
}
async function fetchAiCached(symbol,opts={}){const box=document.getElementById('predictionResult2');const statusEl=document.getElementById('aiAutoStatus');try{const [pred,over]=await Promise.all([api(`/predict/${symbol}`),api(`/ai-analysis/${symbol}`)]);const payload=JSON.stringify({modes:pred?.modes||{},over});if(opts.silent&&payload===lastAiPayload)return;lastAiPayload=payload;box.innerHTML=renderAiGrid(pred,overviewHeaderHtml(over,over?.model));if(statusEl)statusEl.textContent=`自动刷新中 · 最新读取 ${new Date().toLocaleTimeString()} · 状态 ${over?.status||'-'}`}catch(e){if(statusEl)statusEl.textContent=`自动刷新异常：${e.message||e}`;if(!opts.silent)box.innerHTML=`<div class="error">读取AI缓存失败: ${esc(e.message||e)}</div>`}}
async function fetchPrediction2(symbol,opts){const auto=!!(opts&&opts.auto);const now=Date.now();if(auto&&(now-lastAiFetchAt)<AI_THROTTLE_MS)return;lastAiFetchAt=now;const box=document.getElementById('predictionResult2');box.innerHTML='<div class="loading">正在请求后端重试失败项并读取 AI 缓存...</div>';let retryStatus='';try{const rr=await fetch(`${API_BASE}/ai-analysis/${symbol}/retry-failed`,{method:'POST'});if(rr&&rr.ok){const rj=await rr.json().catch(()=>null);if(rj&&rj.status)retryStatus=String(rj.status)}}catch(_e){/* ignore retry kick errors; cache read still proceeds */}try{const [pred,over]=await Promise.all([api(`/predict/${symbol}`),api(`/ai-analysis/${symbol}`)]);lastAiPayload=JSON.stringify({modes:pred?.modes||{},over,retryStatus});const overWithNote=(retryStatus&&over&&typeof over==='object')?Object.assign({},over,{_retry_status:retryStatus}):over;let html=renderAiGrid(pred,overviewHeaderHtml(overWithNote,over?.model));if(retryStatus){html+=`<div class="ai-note">后端重试状态：${esc(retryStatus)}（仅重试失败项，不重复生成已成功的缓存）</div>`}box.innerHTML=html}catch(e){box.innerHTML=`<div class="error">AI缓存读取失败：${esc(e.message||e)}</div>`}}
function refreshAll(){updateTitles();lastPredictionPayload='';lastAiPayload='';lastAiRetryAt=0;Promise.allSettled([fetchAndRender(leftChart1,currentSymbol,rightChart1),fetchAndRender(leftChart2,'BTC',rightChart2)]).then(()=>{fetchPrediction(currentSymbol);fetchPrediction2(currentSymbol,{auto:true})})}
function refreshSingle(){updateTitles();lastPredictionPayload='';lastAiPayload='';lastAiRetryAt=0;Promise.allSettled([fetchAndRender(leftChart1,currentSymbol,rightChart1)]).then(()=>{fetchPrediction(currentSymbol);fetchPrediction2(currentSymbol,{auto:true})})}
function refreshAuto(){updateTitles();Promise.allSettled([fetchAndRender(leftChart1,currentSymbol,rightChart1),fetchAndRender(leftChart2,'BTC',rightChart2)])}
window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));refreshAll();setInterval(refreshAuto,120000);setInterval(()=>fetchPrediction(currentSymbol,{silent:true}),PREDICTION_POLL_MS);setInterval(()=>fetchAiCached(currentSymbol,{silent:true}),AI_CACHE_POLL_MS);setInterval(()=>fetchPrediction2(currentSymbol,{auto:true}),AI_RETRY_POLL_MS);
</script>
