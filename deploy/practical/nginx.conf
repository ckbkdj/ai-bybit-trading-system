events {}
http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8443 ssl;
        server_name predictor-paper.internal;

        ssl_certificate /etc/nginx/pki/control-plane.crt;
        ssl_certificate_key /etc/nginx/pki/control-plane.key;
        ssl_client_certificate /etc/nginx/pki/executor-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Executor-Consumer-ID $http_x_executor_consumer_id;
            proxy_set_header X-Client-Certificate-Identity $ssl_client_s_dn_cn;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
