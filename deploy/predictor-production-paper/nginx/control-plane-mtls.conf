# Bind this listener only to the predictor WireGuard address.
server {
    listen 10.70.0.1:8443 ssl;
    server_name predictor-paper.internal;
    ssl_certificate /etc/ai-bybit/pki/control-plane.crt;
    ssl_certificate_key /etc/ai-bybit/pki/control-plane.key;
    ssl_client_certificate /etc/ai-bybit/pki/executor-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Executor-Consumer-ID $http_x_executor_consumer_id;
        proxy_set_header X-Client-Certificate-Identity $ssl_client_s_dn_cn;
        proxy_set_header Host $host;
    }
}
