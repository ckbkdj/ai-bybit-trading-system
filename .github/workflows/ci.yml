name: repository-ci

on:
  push:
    branches:
      - main
      - "review/**"
      - "release/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-tests:
    name: execution tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            lock-file: requirements/linux-py311.lock
          - os: windows-latest
            python-version: "3.12"
            lock-file: requirements/windows-py312.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r ${{ matrix.lock-file }}
      - name: Run execution regression
        run: python -m pytest BybitContractBotV4/tests -q
      - name: Compile active execution service
        run: python -m compileall -q BybitContractBotV4

  prediction-tests:
    name: prediction tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            lock-file: requirements/linux-py311.lock
          - os: windows-latest
            python-version: "3.12"
            lock-file: requirements/windows-py312.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r ${{ matrix.lock-file }}
      - name: Run prediction regression
        working-directory: ai_bot3/ai_bot3
        run: python -m pytest tests -q
      - name: Compile active prediction service
        run: python -m compileall -q ai_bot3/ai_bot3

  shadow-e2e:
    name: cross-process shadow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/linux-py311.lock
      - name: Install locked E2E dependencies
        run: python -m pip install --require-hashes -r requirements/linux-py311.lock
      - name: Run real HTTP shadow loop
        run: python scripts/run_shadow_e2e.py

  repository-audit:
    name: tracked-secret and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install locked vulnerability auditor
        run: python -m pip install --require-hashes -r requirements/audit.lock
      - name: Generate audit evidence
        shell: bash
        run: |
          python -m pip_audit \
            --requirement requirements/linux-py311.lock \
            --disable-pip --format json --output pip-audit.json \
            --progress-spinner off || audit_status=$?
          audit_status=${audit_status:-0}
          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 1 ]; then
            exit "$audit_status"
          fi
          set +e
          python scripts/supply_chain_audit.py \
            --vulnerability-report pip-audit.json \
            --output supply-chain-audit.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python -m pip_audit \
            --requirement requirements/linux-py311.lock \
            --disable-pip --format cyclonedx-json --output sbom.cdx.json \
            --progress-spinner off || sbom_status=$?
          sbom_status=${sbom_status:-0}
          if [ "$sbom_status" -ne 0 ] && [ "$sbom_status" -ne 1 ]; then
            exit "$sbom_status"
          fi
          cd ai_bot3/ai_bot3
          npm audit --package-lock-only --json > ../../npm-audit.json || npm_status=$?
          npm_status=${npm_status:-0}
          if [ "$npm_status" -ne 0 ] && [ "$npm_status" -ne 1 ]; then
            exit "$npm_status"
          fi
          cd ../..
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("supply-chain-audit.json").read_text(encoding="utf-8"))
          secrets = report["tracked_secret_scan"]
          history = report["git_history_secret_scan"]
          node = report["node_lock_integrity"]
          if secrets["finding_count"] or secrets["tracked_sensitive_paths"]:
              raise SystemExit("tracked credential finding blocks CI")
          if history["finding_count"] or history["historical_sensitive_paths"]:
              raise SystemExit("reachable Git history contains credential findings")
          if history["scan_limit_reached"]:
              raise SystemExit("Git history credential scan limit was reached")
          if node["missing_integrity_entries"]:
              raise SystemExit("Node lockfile integrity is incomplete")
          vulnerability = report["vulnerability_scan"]
          if vulnerability["status"] != "PASS":
              raise SystemExit("current vulnerability attestation did not pass")
          npm = json.loads(Path("npm-audit.json").read_text(encoding="utf-8"))
          if (npm.get("metadata", {}).get("vulnerabilities", {}).get("total") or 0) != 0:
              raise SystemExit("npm audit reported vulnerabilities")
          print("Repository, dependency-lock and current vulnerability audit passed.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: supply-chain-audit
          path: |
            supply-chain-audit.json
            pip-audit.json
            npm-audit.json
            sbom.cdx.json
          if-no-files-found: error

  truth-regression:
    name: authenticity regression (shadow only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BYBIT_TRADING_MODE: shadow
      BYBIT_ENABLE_LIVE: "false"
      LIVE_TRADING: "false"
      ENABLE_LIVE_TRADING: "false"
      MAINNET_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/linux-py311.lock
            requirements/audit.lock
      - name: Install locked authenticity dependencies
        run: |
          python -m pip install --require-hashes -r requirements/linux-py311.lock
          python -m pip install --require-hashes -r requirements/audit.lock
      - name: Create current dependency vulnerability evidence
        run: |
          python -m pip_audit \
            --requirement requirements/linux-py311.lock \
            --disable-pip --format json --output pip-audit.json \
            --progress-spinner off
      - name: Run evidence-producing authenticity regression
        run: >-
          python scripts/run_truth_regression.py
          --vulnerability-report pip-audit.json
          --output truth-regression.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: truth-regression
          path: |
            truth-regression.json
            pip-audit.json
          if-no-files-found: error
