name: deployment-smoke

on:
  push:
    branches:
      - "release/two-node-production-paper-v1"
  pull_request:
    paths:
      - "BybitContractBotV4/**"
      - "ai_bot3/**"
      - "deploy/**"
      - "shadow_contracts/**"
      - "scripts/run_deployment_smoke.py"
      - ".github/workflows/deployment-smoke.yml"

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-smoke:
    name: production-paper smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            lock: requirements/linux-py311.lock
          - os: windows-latest
            python: "3.12"
            lock: requirements/windows-py312.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install exact locked runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r "${{ matrix.lock }}"
      - name: Run deployment truth smoke
        env:
          APP_CODE_COMMIT: ${{ github.sha }}
        run: python scripts/run_deployment_smoke.py
      - name: Compile deployment entrypoints
        run: |
          python -m compileall -q BybitContractBotV4 ai_bot3/ai_bot3 shadow_contracts scripts/run_deployment_smoke.py
