name: deployment-smoke

on:
  push:
    branches:
      - "release/two-node-production-paper-v1"
  pull_request:
    paths:
      - "BybitContractBotV4/**"
      - "ai_bot3/**"
      - "deploy/**"
      - "ops_console/**"
      - "shadow_contracts/**"
      - "scripts/run_deployment_smoke.py"
      - "scripts/physical_shadow_acceptance.py"
      - "scripts/testnet_admission.py"
      - "scripts/validate_practical_deployment.py"
      - "scripts/verify_shadow_lab.py"
      - ".dockerignore"
      - ".github/workflows/deployment-smoke.yml"

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  EXACT_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  deployment-smoke:
    name: production-paper smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            lock: requirements/linux-py311.lock
          - os: windows-latest
            python: "3.12"
            lock: requirements/windows-py312.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXACT_CODE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Verify exact checkout
        env:
          APP_CODE_COMMIT: ${{ env.EXACT_CODE_SHA }}
        run: >-
          python -c "import os, subprocess; expected=os.environ['APP_CODE_COMMIT']; actual=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); assert actual == expected, f'checkout mismatch: {actual} != {expected}'; print(f'exact checkout: {actual}')"
      - name: Install exact locked runtime
        run: python -m pip install --require-hashes -r "${{ matrix.lock }}"
      - name: Run deployment truth smoke
        env:
          APP_CODE_COMMIT: ${{ env.EXACT_CODE_SHA }}
        run: python scripts/run_deployment_smoke.py
      - name: Validate practical two-node deployment layer
        env:
          APP_CODE_COMMIT: ${{ env.EXACT_CODE_SHA }}
          APP_ENV: development
        run: python scripts/validate_practical_deployment.py
      - name: Compile deployment and acceptance entrypoints
        run: |
          python -m compileall -q BybitContractBotV4 ai_bot3/ai_bot3 shadow_contracts ops_console scripts/run_deployment_smoke.py scripts/physical_shadow_acceptance.py scripts/testnet_admission.py scripts/validate_practical_deployment.py scripts/verify_shadow_lab.py deploy/docker/tcp_healthcheck.py

  container-shadow-smoke:
    name: actual container shadow startup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXACT_CODE_SHA }}
      - name: Verify exact checkout and Docker runtime
        env:
          APP_CODE_COMMIT: ${{ env.EXACT_CODE_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$APP_CODE_COMMIT"
          docker version
          docker compose version
          docker compose -f deploy/practical/shadow-lab.compose.yml config > container-shadow-compose.yml
      - name: Build actual Shadow Lab images
        env:
          DOCKER_BUILDKIT: "1"
        run: >-
          docker compose -f deploy/practical/shadow-lab.compose.yml
          build control-plane executor ops-console
      - name: Start actual Shadow Lab containers
        run: >-
          docker compose -f deploy/practical/shadow-lab.compose.yml
          up -d --no-build control-plane executor ops-console
      - name: Verify cross-container paper-only health
        run: >-
          python3 scripts/verify_shadow_lab.py
          --deadline-seconds 240
          --output container-shadow-smoke.json
      - name: Collect container evidence
        if: always()
        run: |
          docker compose -f deploy/practical/shadow-lab.compose.yml ps -a > container-shadow-ps.txt || true
          docker compose -f deploy/practical/shadow-lab.compose.yml logs --no-color --timestamps > container-shadow-containers.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: actual-container-shadow-smoke
          path: |
            container-shadow-compose.yml
            container-shadow-smoke.json
            container-shadow-ps.txt
            container-shadow-containers.log
          if-no-files-found: warn
      - name: Stop Shadow Lab and remove test volumes
        if: always()
        run: >-
          docker compose -f deploy/practical/shadow-lab.compose.yml
          down -v --remove-orphans
